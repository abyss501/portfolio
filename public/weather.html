<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天气查询 · Weather</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-400 via-sky-500 to-blue-700 px-4 py-10 text-white">
<div class="mx-auto max-w-md">
  <h1 class="text-center text-2xl font-black tracking-wide">🌤️ 天气查询</h1>

  <!-- 搜索框（假样式） -->
  <div class="mt-6 flex items-center gap-2 rounded-full bg-white/20 px-5 py-3 backdrop-blur-md">
    <svg class="h-4 w-4 text-white/70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M21 21l-4.3-4.3"/></svg>
    <input type="text" placeholder="搜索城市，如：北京 / 上海…" class="w-full bg-transparent text-sm placeholder-white/60 outline-none">
  </div>

  <!-- 主卡片 -->
  <div class="mt-6 rounded-3xl bg-white/20 p-8 text-center shadow-xl backdrop-blur-md">
    <p class="flex items-center justify-center gap-1 text-sm text-white/80">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 21s-7-5.5-7-11a7 7 0 1114 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      武汉市
    </p>
    <p class="mt-2 text-8xl font-black tracking-tight">24°</p>
    <p class="mt-2 text-lg font-medium">⛅ 多云</p>
    <p class="mt-1 text-sm text-white/70">最高 28° · 最低 20°</p>
  </div>

  <!-- 未来 3 天预报 -->
  <div class="mt-4 grid grid-cols-3 gap-3">
    <div class="rounded-2xl bg-white/20 p-4 text-center backdrop-blur-md">
      <p class="text-xs text-white/70">今天</p><p class="mt-2 text-3xl">⛅</p>
      <p class="mt-2 text-sm font-semibold">28° / 20°</p><p class="text-xs text-white/60">多云</p>
    </div>
    <div class="rounded-2xl bg-white/20 p-4 text-center backdrop-blur-md">
      <p class="text-xs text-white/70">明天</p><p class="mt-2 text-3xl">🌧️</p>
      <p class="mt-2 text-sm font-semibold">25° / 18°</p><p class="text-xs text-white/60">小雨</p>
    </div>
    <div class="rounded-2xl bg-white/20 p-4 text-center backdrop-blur-md">
      <p class="text-xs text-white/70">后天</p><p class="mt-2 text-3xl">☀️</p>
      <p class="mt-2 text-sm font-semibold">30° / 21°</p><p class="text-xs text-white/60">晴</p>
    </div>
  </div>

  <!-- 详细数据网格 -->
  <div class="mt-4 grid grid-cols-2 gap-3">
    <div class="rounded-2xl bg-white/20 p-4 backdrop-blur-md">
      <p class="text-xs text-white/60">💧 湿度</p><p class="mt-1 text-xl font-bold">62%</p>
    </div>
    <div class="rounded-2xl bg-white/20 p-4 backdrop-blur-md">
      <p class="text-xs text-white/60">🌬️ 风速</p><p class="mt-1 text-xl font-bold">3 级 · 东风</p>
    </div>
    <div class="rounded-2xl bg-white/20 p-4 backdrop-blur-md">
      <p class="text-xs text-white/60">🕶️ 紫外线</p><p class="mt-1 text-xl font-bold">中等</p>
    </div>
    <div class="rounded-2xl bg-white/20 p-4 backdrop-blur-md">
      <p class="text-xs text-white/60">😷 空气质量</p><p class="mt-1 text-xl font-bold">良 · 58</p>
    </div>
    <div class="rounded-2xl bg-white/20 p-4 backdrop-blur-md">
      <p class="text-xs text-white/60">🌅 日出</p><p class="mt-1 text-xl font-bold">06:24</p>
    </div>
    <div class="rounded-2xl bg-white/20 p-4 backdrop-blur-md">
      <p class="text-xs text-white/60">🌇 日落</p><p class="mt-1 text-xl font-bold">18:02</p>
    </div>
  </div>

  <p class="mt-6 text-center text-[11px] text-white/50">数据更新于 今天 14:00 · 演示数据</p>
</div>
</body>
</html>
